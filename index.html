<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío de Soplido Extremo - oIo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #ui-container {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        #instruction-text {
            font-size: 14px;
            color: #a0a5b5;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 40px;
        }

        button {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(79, 172, 254, 0.4);
            transition: all 0.2s ease;
        }

        button.waiting {
            background: linear-gradient(135deg, #ffa000, #ff6f00);
            box-shadow: 0 6px 25px rgba(255, 160, 0, 0.4);
            cursor: not-allowed;
        }

        button.active-blowing {
            background: linear-gradient(135deg, #ff4757, #ff2a6d);
            box-shadow: 0 6px 25px rgba(255, 71, 87, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* CONTENEDOR PRINCIPAL oIo */
        #balloons-group {
            position: absolute;
            bottom: -5px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transform-origin: bottom center;
            transform: scale(0.05);
            will-change: transform;
        }

        /* --- EL CONDÓN CENTRAL --- */
        #center-balloon {
            width: 55px;
            height: 330px;
            /* Color látex semitransparente con brillo */
            background: linear-gradient(90deg, rgba(254,236,214,0.85), rgba(255,255,255,0.95), rgba(254,236,214,0.85));
            border-radius: 25px 25px 8px 8px;
            z-index: 3;
            position: relative;
            box-shadow: 
                inset -10px 0 25px rgba(0, 0, 0, 0.15), 
                inset 8px 8px 20px rgba(255, 255, 255, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* La burbuja / depósito de la punta superior del condón */
        #center-balloon::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.1), inset 3px 3px 5px rgba(255,255,255,1);
        }

        /* --- LOS HUEVITOS KINDER LATERALES --- */
        .egg {
            width: 90px;
            height: 120px;
            /* Forma geométrica de huevo (más angosto arriba, ancho abajo) */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 2;
            margin: 0 -15px; 
            margin-bottom: 5px; 
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset -12px -12px 25px rgba(0, 0, 0, 0.35), 
                inset 10px 10px 20px rgba(255, 255, 255, 0.5),
                0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Mitad superior blanca del huevo Kinder */
        .egg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52%;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border-bottom: 3px solid #e0e0e0;
        }

        /* Mitad inferior naranja brillante del huevo Kinder */
        .egg::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background: linear-gradient(135deg, #ff6d00, #ff9100);
        }

        /* El anillo/borde de la base del condón */
        #ring-base {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 12px;
            background-color: rgba(254,236,214,0.95);
            border-radius: 6px;
            z-index: 4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,1);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🎈 Desafío oIo Custom</h1>
        <div id="instruction-text">Toca el botón inferior para dar los permisos correspondientes.</div>
        <button id="start-btn">Activar e Inflar</button>
    </div>

    <div id="balloons-group">
        <div class="egg" id="left-egg"></div>
        <div id="center-balloon"></div>
        <div class="egg" id="right-egg"></div>
        <div id="ring-base"></div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const instructionText = document.getElementById('instruction-text');
        const balloonsGroup = document.getElementById('balloons-group');
        
        let audioContext, analyser, microphone;
        let currentScale = 0.05; 
        let isListening = false; 

        startBtn.addEventListener('click', async () => {
            if(startBtn.classList.contains('waiting') || isListening) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 512;
                microphone.connect(analyser);

                let countdown = 3;
                startBtn.classList.add('waiting');
                startBtn.innerText = `Preparando... (${countdown}s)`;
                instructionText.innerHTML = "<span style='color: #ffa000;'>¡Permiso concedido! Prepárate, pero NO soples todavía...</span>";
                balloonsGroup.style.transform = `scale(${currentScale})`;

                const countdownInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        startBtn.innerText = `Preparando... (${countdown}s)`;
                    } else {
                        clearInterval(countdownInterval);
                        
                        isListening = true;
                        startBtn.className = 'active-blowing';
                        startBtn.innerText = "¡SOPLA AL MICRÓFONO AHORA!";
                        instructionText.innerHTML = "<span style='color: #ff4757; font-weight: bold;'>¡Sopla fuerte abajo para inflar el condón y los huevitos! 📱💨</span>";
                        
                        processBlow();
                    }
                }, 1000);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function processBlow() {
                    if(!isListening) return;

                    analyser.getByteFrequencyData(dataArray);
                    
                    let total = 0;
                    const sampleBins = 25; 
                    for (let i = 0; i < sampleBins; i++) {
                        total += dataArray[i];
                    }
                    let blowIntensity = total / sampleBins;

                    if (blowIntensity > 60) { 
                        currentScale += (blowIntensity * 0.0005); 
                        if (currentScale > 1.8) currentScale = 1.8; 
                    } else {
                        currentScale -= 0.006; 
                        if (currentScale < 0.05) currentScale = 0.05;
                    }

                    let vibrationX = 0;
                    let vibrationY = 0;
                    
                    if (blowIntensity > 60) {
                        const time = performance.now() * 0.1;
                        const shakeStrength = (blowIntensity - 60) * 0.0008; 
                        vibrationX = Math.sin(time) * shakeStrength;
                        vibrationY = Math.cos(time) * shakeStrength;
                    }

                    let finalScaleX = (currentScale + vibrationX) * 0.95;
                    let finalScaleY = (currentScale * 1.25) + vibrationY;

                    balloonsGroup.style.transform = `scale(${finalScaleX}, ${finalScaleY})`;

                    requestAnimationFrame(processBlow);
                }

            } catch (err) {
                alert('No se pudo acceder al micrófono. Asegúrate de dar los permisos correspondientes.');
                console.error(err);
            }
        });
    </script>
</body>
</html>
